    <script>
      // Datos de respaldo (Hardcoded) para asegurar que funcione aunque falle el JSON externo
      const fallbackProducts = [
        { "id": 1, "title": "Audífonos Bluetooth", "description": "Audífonos inalámbricos con cancelación de ruido", "price": 29.99, "category": "Audio", "image": "../images/audifonos.jpg" },
        { "id": 2, "title": "Camiseta Tecnológica", "description": "Camiseta con fibra inteligente", "price": 19.99, "category": "Ropa", "image": "../images/camiseta.jpg" },
        { "id": 3, "title": "Teclado Mecánico", "description": "Teclado gamer RGB switches azules", "price": 45.50, "category": "Periféricos", "image": "../images/teclado.jpg" },
        { "id": 4, "title": "Mouse Gamer", "description": "Mouse de alta precisión 16000 DPI", "price": 25.00, "category": "Periféricos", "image": "../images/mouse.jpg" },
        { "id": 5, "title": "Monitor 24 pulgadas", "description": "Monitor Full HD IPS 144Hz", "price": 120.00, "category": "Monitores", "image": "../images/monitor.jpg" },
        { "id": 6, "title": "Silla Ergonómica", "description": "Silla de oficina con soporte lumbar", "price": 89.99, "category": "Muebles", "image": "../images/silla.jpg" },
        { "id": 7, "title": "Lámpara LED", "description": "Lámpara de escritorio ajustable", "price": 15.00, "category": "Accesorios", "image": "../images/lampara.jpg" },
        { "id": 8, "title": "Cargador Rápido", "description": "Cargador USB-C 30W", "price": 12.50, "category": "Accesorios", "image": "../images/cargador.jpg" }
      ];

      let allProducts = [];

      // Función principal de inicialización
      document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('search-input');
        const searchForm = document.getElementById('search-form');
        const resultsContainer = document.getElementById('results-container');
        const noResultsMsg = document.getElementById('no-results-msg');
        const termDisplay = document.getElementById('search-term-display');

        // Cargar productos (Intenta JSON externo, usa fallback si falla)
        fetch('../products/products.json')
          .then(response => {
            if (!response.ok) throw new Error('JSON no encontrado');
            return response.json();
          })
          .then(data => {
            allProducts = Array.isArray(data) ? data : fallbackProducts;
            handleSearch(); // Ejecutar búsqueda inicial si hay params
          })
          .catch(err => {
            console.log("Usando lista de productos local debido a:", err);
            allProducts = fallbackProducts;
            handleSearch();
          });

        // Manejar envío del formulario
        searchForm.addEventListener('submit', function(e) {
          e.preventDefault();
          handleSearch();
        });

        // Manejar escritura en tiempo real (opcional, mejora UX)
        searchInput.addEventListener('input', function() {
           // Descomentar si se quiere búsqueda instantánea
           // handleSearch(); 
        });

        function handleSearch() {
          // Obtener término de la URL o del input
          const urlParams = new URLSearchParams(window.location.search);
          let query = urlParams.get('search') || searchInput.value;
          
          // Limpiar y normalizar
          query = (query || '').trim().toLowerCase();
          searchInput.value = query; // Sincronizar input
          
          // Actualizar texto de encabezado
          termDisplay.textContent = query ? `Resultados para: "${query}"` : "Todos los productos";

          // Filtrar productos
          const filtered = allProducts.filter(product => {
            if (!query) return true; // Si está vacío, mostrar todo (o podríamos retornar false)
            
            const title = (product.title || '').toLowerCase();
            const desc = (product.description || '').toLowerCase();
            const cat = (product.category || '').toLowerCase();
            const idStr = String(product.id || '');

            return title.includes(query) || desc.includes(query) || cat.includes(query) || idStr.includes(query);
          });

          renderResults(filtered, query);
        }

        function renderResults(products, query) {
          resultsContainer.innerHTML = ''; // Limpiar anteriores
          
          if (products.length === 0) {
            resultsContainer.classList.add('u-hidden');
            noResultsMsg.style.display = 'block';
            return;
          }

          noResultsMsg.style.display = 'none';
          resultsContainer.classList.remove('u-hidden');

          products.forEach(product => {
            // Crear tarjeta HTML
            const card = document.createElement('div');
            card.className = 'u-align-center u-container-style u-repeater-item u-white u-repeater-item-1';
            
            // Imagen por defecto si no existe
            const imgSrc = product.image && product.image !== '' ? product.image : '../images/default-product.jpg';
            const priceFormatted = typeof product.price === 'number' ? `$${product.price.toFixed(2)}` : (product.price || 'Consultar');

            card.innerHTML = `
              <div class="u-container-layout u-similar-container u-valign-top u-container-layout-1">
                <img alt="${product.title}" class="u-expanded-width u-image u-image-default u-image-1" src="${imgSrc}">
                <h4 class="u-text u-text-default u-text-1">${product.title || 'Sin título'}</h4>
                <p class="u-text u-text-2">${product.description || 'Sin descripción'}</p>
                <h5 class="u-text u-text-palette-1-base u-text-3" style="font-weight: 700;">${priceFormatted}</h5>
                <a href="../product-detail.html?id=${product.id}" class="u-btn u-button-style u-palette-1-base u-btn-1">Ver Producto</a>
              </div>
            `;
            resultsContainer.appendChild(card);
          });
        }
      });
    </script>
