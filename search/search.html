    <!-- LÓGICA DE BÚSQUEDA CORREGIDA -->
    <script>
      // Función para normalizar texto (quitar acentos, emojis, minúsculas)
      function normalizeText(text) {
        if (!text) return '';
        return text.toString()
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '') // Quitar acentos
          .replace(/[^\w\s]/gi, '') // Quitar caracteres especiales y emojis
          .trim();
      }

      // Calcular relevancia
      function calculateRelevance(product, searchTerm) {
        let score = 0;
        const normalizedSearch = normalizeText(searchTerm);
        
        const normalizedTitle = normalizeText(product.titulo || '');
        const normalizedDesc = normalizeText(product.descripcion || '');
        const normalizedCat = normalizeText(product.categoria || '');
        const normalizedId = normalizeText(product.id || '');

        // Coincidencia exacta en título (Máxima prioridad)
        if (normalizedTitle === normalizedSearch) score += 100;
        else if (normalizedTitle.includes(normalizedSearch)) score += 50;

        // Coincidencia en ID o SKU
        if (normalizedId.includes(normalizedSearch)) score += 30;

        // Coincidencia en Categoría
        if (normalizedCat.includes(normalizedSearch)) score += 20;

        // Coincidencia en Descripción (Menor prioridad)
        if (normalizedDesc.includes(normalizedSearch)) score += 10;

        return score;
      }

      // Crear tarjeta de producto
      function createProductCard(product) {
        const productId = product.id || 'unknown';
        const title = product.titulo || 'Producto sin nombre';
        const price = product.precio ? `$${parseFloat(product.precio).toLocaleString('es-CO')}` : 'Consultar';
        const category = product.categoria || 'General';
        // Usar la primera imagen del array, o una por defecto
        const image = (product.imagenes && product.imagenes.length > 0) 
                      ? product.imagenes[0] 
                      : '../images/default-product.jpg';

        const card = document.createElement('a');
        card.className = 'product-card-custom';
        card.href = `../Tecnonel/Producto.html?id=${productId}`;

        card.innerHTML = `
          <img src="${image}" alt="${title}" class="product-img-custom" onerror="this.src='../images/default-product.jpg'">
          <div class="product-info-custom">
            <h3 class="product-title-custom">${title}</h3>
            <p class="product-price-custom">${price}</p>
            <p class="product-cat-custom">${category}</p>
          </div>
        `;
        return card;
      }

      // Ejecutar búsqueda al cargar
      document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const searchQuery = urlParams.get('s') || urlParams.get('search') || '';
        const resultsGrid = document.getElementById('resultsGrid');
        const searchTitle = document.getElementById('searchTitle');

        if (!searchQuery) {
          searchTitle.textContent = 'Ingresa un término de búsqueda';
          resultsGrid.innerHTML = '<div class="no-results-msg"><h3>La barra de búsqueda está vacía</h3><p>Escribe algo para encontrar productos increíbles.</p></div>';
          return;
        }

        searchTitle.textContent = `Resultados para "${searchQuery}"`;
        resultsGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Cargando productos...</p>';

        fetch('../products/products.json')
          .then(res => res.json())
          .then(data => {
            // Manejar si data.productos existe o si data es directamente el array
            const products = data.productos || data;
            
            const filtered = products
              .map(p => ({ product: p, score: calculateRelevance(p, searchQuery) }))
              .filter(item => item.score > 0)
              .sort((a, b) => b.score - a.score)
              .map(item => item.product);

            resultsGrid.innerHTML = '';
            
            if (filtered.length === 0) {
              resultsGrid.innerHTML = `
                <div class="no-results-msg">
                  <h3>No se encontraron productos</h3>
                  <p>Intenta con otros términos como "audifonos", "camiseta", "tecnologia".</p>
                </div>`;
            } else {
              filtered.forEach(p => resultsGrid.appendChild(createProductCard(p)));
            }
          })
          .catch(err => {
            console.error(err);
            resultsGrid.innerHTML = '<div class="no-results-msg"><h3>Error al cargar</h3><p>No pudimos conectar con la base de datos de productos.</p></div>';
          });
      });
    </script>
