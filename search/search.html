    <script>
      let allProducts = [];

      // Función principal de inicialización
      document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('search-input');
        const searchForm = document.getElementById('search-form');
        const resultsContainer = document.getElementById('results-container');
        const noResultsMsg = document.getElementById('no-results-msg');
        const termDisplay = document.getElementById('search-term-display');

        // Cargar productos desde JSON
        fetch('../products/products.json')
          .then(response => {
            if (!response.ok) throw new Error('JSON no encontrado');
            return response.json();
          })
          .then(data => {
            // El JSON tiene estructura: { config: {...}, productos: [...] }
            if (data && Array.isArray(data.productos)) {
              allProducts = data.productos;
            } else {
              allProducts = [];
            }
            handleSearch();
          })
          .catch(err => {
            console.log("Error cargando productos:", err);
            allProducts = [];
            handleSearch();
          });

        // Manejar envío del formulario
        searchForm.addEventListener('submit', function(e) {
          e.preventDefault();
          handleSearch();
        });

        function handleSearch() {
          // Obtener término de la URL o del input
          const urlParams = new URLSearchParams(window.location.search);
          let query = urlParams.get('search') || searchInput.value;
          
          // Limpiar y normalizar
          query = (query || '').trim().toLowerCase();
          searchInput.value = query;
          
          // Actualizar texto de encabezado
          termDisplay.textContent = query ? `Resultados para: "${query}"` : "Todos los productos";

          // Filtrar productos
          const filtered = allProducts.filter(product => {
            if (!query) return true;
            
            const title = (product.titulo || '').toLowerCase();
            const desc = (product.descripcion || '').toLowerCase();
            const cat = (product.categoria || '').toLowerCase();
            const idStr = String(product.id || '');

            return title.includes(query) || desc.includes(query) || cat.includes(query) || idStr.includes(query);
          });

          renderResults(filtered, query);
        }

        function renderResults(products, query) {
          resultsContainer.innerHTML = '';
          
          if (products.length === 0) {
            resultsContainer.classList.add('u-hidden');
            noResultsMsg.style.display = 'block';
            return;
          }

          noResultsMsg.style.display = 'none';
          resultsContainer.classList.remove('u-hidden');

          products.forEach(product => {
            // Solo mostrar productos con imágenes válidas
            const imgSrc = product.imagenes && product.imagenes.length > 0 ? product.imagenes[0] : '../images/default-product.jpg';
            const priceFormatted = typeof product.precio === 'number' ? `$${product.precio.toLocaleString('es-CO')}` : 'Consultar';

            const card = document.createElement('div');
            card.className = 'u-align-center u-container-style u-repeater-item u-white u-repeater-item-1';
            
            card.innerHTML = `
              <div class="u-container-layout u-similar-container u-valign-top u-container-layout-1">
                <img alt="${product.titulo}" class="u-expanded-width u-image u-image-default u-image-1" src="${imgSrc}" onerror="this.src='../images/default-product.jpg'">
                <h4 class="u-text u-text-default u-text-1">${product.titulo || 'Sin título'}</h4>
                <p class="u-text u-text-2">${(product.descripcion || 'Sin descripción').substring(0, 100)}${(product.descripcion || '').length > 100 ? '...' : ''}</p>
                <h5 class="u-text u-text-palette-1-base u-text-3" style="font-weight: 700;">${priceFormatted}</h5>
                <a href="../Tecnonel/Producto.html?id=${product.id}" class="u-btn u-button-style u-palette-1-base u-btn-1">Ver Producto</a>
              </div>
            `;
            resultsContainer.appendChild(card);
          });
        }
      });
    </script>
