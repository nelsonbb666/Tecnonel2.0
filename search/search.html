    <!-- LÓGICA DE BÚSQUEDA INTELIGENTE -->
    <script>
      // Función para normalizar texto (quitar acentos, emojis, minúsculas)
      function normalizeText(text) {
        if (!text) return '';
        return text.toString()
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '') // Quitar acentos
          .replace(/[^\w\s]/gi, '') // Quitar caracteres especiales y emojis
          .trim();
      }

      // Calcular relevancia
      function calculateRelevance(product, searchTerm) {
        let score = 0;
        const normSearch = normalizeText(searchTerm);
        
        const normTitle = normalizeText(product.titulo || '');
        const normDesc = normalizeText(product.descripcion || '');
        const normCat = normalizeText(product.categoria || '');
        const normId = normalizeText(product.id || '');
        const normTags = normalizeText(product.etiquetas || '');

        // Coincidencia exacta en título (Máxima prioridad)
        if (normTitle === normSearch) score += 100;
        else if (normTitle.includes(normSearch)) score += 50;

        // Categoría y Marca (si existiera)
        if (normCat.includes(normSearch)) score += 25;
        
        // ID o SKU
        if (normId.includes(normSearch)) score += 20;

        // Etiquetas
        if (normTags.includes(normSearch)) score += 15;

        // Descripción (Menor prioridad)
        if (normDesc.includes(normSearch)) score += 10;

        return score;
      }

      // Crear tarjeta HTML
      function createCard(product) {
        const imgUrl = product.imagenes && product.imagenes.length > 0 
          ? product.imagenes[0] 
          : '../images/default-product.jpg';
        
        const price = product.precio ? `$${parseFloat(product.precio).toLocaleString('es-CO')}` : 'Consultar';
        const title = product.titulo || 'Producto sin nombre';
        const cat = product.categoria || '';
        const id = product.id || 'unknown';

        return `
          <a href="../Tecnonel/Producto.html?id=${id}" class="product-card-custom">
            <img src="${imgUrl}" alt="${title}" class="product-img-custom" onerror="this.src='../images/default-product.jpg'">
            <div class="product-info-custom">
              <h3 class="product-title-custom">${title}</h3>
              <p class="product-price-custom">${price}</p>
              <p class="product-cat-custom">${cat}</p>
            </div>
          </a>
        `;
      }

      // Ejecutar búsqueda al cargar
      document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const query = params.get('s'); // El parámetro es 's' según tu URL actual
        const grid = document.getElementById('resultsGrid');
        const titleDisplay = document.getElementById('searchTitle');

        if (!query) {
          grid.innerHTML = '<div class="no-results-msg">Por favor ingresa un término de búsqueda.</div>';
          titleDisplay.textContent = 'Búsqueda vacía';
          return;
        }

        titleDisplay.textContent = `Resultados para "${query}"`;

        fetch('../products/products.json')
          .then(res => res.json())
          .then(data => {
            // Asegurar que tenemos el array correcto (a veces viene dentro de config o directo)
            const products = Array.isArray(data) ? data : (data.productos || []);
            
            const results = products
              .map(p => ({ product: p, score: calculateRelevance(p, query) }))
              .filter(item => item.score > 0)
              .sort((a, b) => b.score - a.score)
              .map(item => item.product);

            if (results.length === 0) {
              grid.innerHTML = `<div class="no-results-msg">No se encontraron productos relacionados con "${query}". Intenta con otro término.</div>`;
            } else {
              grid.innerHTML = results.map(createCard).join('');
            }
          })
          .catch(err => {
            console.error(err);
            grid.innerHTML = '<div class="no-results-msg">Error al cargar los productos. Intente más tarde.</div>';
          });
      });
    </script>
