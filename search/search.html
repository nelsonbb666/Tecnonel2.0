        gap: 20px;
        padding: 40px 20px;
        min-height: 50vh;

      .u-search-result-card {

        width: 250px; /* Ancho fijo para uniformidad */

      }

      /* Forzar imagen cuadrada y uniforme */

        width: 100%;
        height: 250px; 
        overflow: hidden;
        position: relative;
        background-color: #f5f5f5;
      }

      .u-search-image-container img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Recorta la imagen para llenar el espacio sin deformarse */
        position: absolute;
        top: 0;
        left: 0;
      }

      .u-search-body {
        padding: 15px;
        text-align: center;
        border: 1px solid #eee;

        background: white;

      .u-search-title {

        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        height: 3em;

      .u-search-price {

        color: #333;
        font-weight: bold;

        text-decoration: none;
        border-radius: 20px;
        font-size: 0.9rem;
        transition: background 0.3s;

      .u-search-btn:hover {

      }

      .no-results-msg {

    <script>
      // Función principal de búsqueda
      document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('search');
        const resultsContainer = document.getElementById('search-results-grid');
        const termDisplay = document.getElementById('search-term-display');

        // Imagen por defecto si el producto no tiene
        const defaultImage = 'https://via.placeholder.com/300x300?text=Sin+Imagen';

        if (!query || query === 'null' || query.trim() === '') {
          termDisplay.textContent = "Todo";
          loadAllProducts(resultsContainer, defaultImage);
          return;
        }

        termDisplay.textContent = `"${query}"`;
        searchProducts(query, resultsContainer, defaultImage);
      });

      function loadAllProducts(container, defaultImg) {
        fetch('../products.json')
          .then(response => {
            if (!response.ok) throw new Error('Error al cargar products.json');
            return response.json();
          })
          .then(products => {
            renderProducts(products, container, defaultImg);
          })
          .catch(error => {
            console.error('Error:', error);
            container.innerHTML = '<p class="no-results-msg">No se pudo cargar el catálogo. Intente más tarde.</p>';
          });
      }

      function searchProducts(query, container, defaultImg) {
        const lowerQuery = query.toLowerCase().trim();

        fetch('../products.json')
          .then(response => {
            if (!response.ok) throw new Error('Network response was not ok');
            return response.json();
          })
          .then(products => {
            // Filtrado robusto
            const filtered = products.filter(product => {
              if (!product) return false; // Ignorar elementos nulos
              
              const title = (product.title || product.name || '').toLowerCase();
              const desc = (product.description || '').toLowerCase();
              const cat = (product.category || '').toLowerCase();
              const id = String(product.id || '');

              return title.includes(lowerQuery) || 
                     desc.includes(lowerQuery) || 
                     cat.includes(lowerQuery) ||
                     id.includes(lowerQuery);
            });

            if (filtered.length === 0) {
              container.innerHTML = `
                <div class="no-results-msg">
                  <p>No encontramos productos relacionados con "<strong>${query}</strong>".</p>
                  <p>Intenta con otros términos como "audifonos", "camiseta" o "bluetooth".</p>
                  <button onclick="window.location.href='../index.html'" class="u-search-btn" style="margin-top:15px;">Ver todo el catálogo</button>
                </div>`;
            } else {
              renderProducts(filtered, container, defaultImg);
            }
          })
          .catch(error => {
            console.error('Error fetching products:', error);
            container.innerHTML = '<p class="no-results-msg">Hubo un error al buscar. Por favor recarga la página.</p>';
          });
      }

      function renderProducts(products, container, defaultImg) {
        container.innerHTML = ''; // Limpiar loader

        products.forEach(product => {
          // Validación estricta de datos para evitar productos rotos
          if (!product.title && !product.name) return; 

          const title = product.title || product.name;
          const price = product.price ? `$${parseFloat(product.price).toFixed(2)}` : 'Consultar';
          // Usar imagen del producto o la default si es null/undefined/vacío
          const imageSrc = (product.image && product.image.trim() !== '') ? product.image : defaultImg;
          
          // CORRECCIÓN DEL ENLACE 404:
          // Asumimos que tu página de detalles es product-details.html y recibe el ID
          // Si tu estructura es diferente, cambia esta línea.
          const productLink = `../product-details.html?pid=${product.id}`;

          const cardHTML = `
            <div class="u-search-result-card u-product">
              <a href="${productLink}" style="text-decoration: none; color: inherit;">
                <div class="u-search-image-container">
                  <img src="${imageSrc}" alt="${title}" onerror="this.src='${defaultImg}'">
                </div>
                <div class="u-search-body">
                  <h5 class="u-search-title">${title}</h5>
                  <p class="u-search-price">${price}</p>
                  <span class="u-search-btn">Ver Producto</span>
                </div>
              </a>
            </div>
          `;
          
          container.insertAdjacentHTML('beforeend', cardHTML);
        });
      }
