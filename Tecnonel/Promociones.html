<script>
// Función para formatear precio
function formatPrice(price) {
    return '$' + parseFloat(price).toLocaleString('es-CO');
}

// Función para crear tarjeta de producto
function createProductCard(product) {
    const imageUrl = product.imagenes && product.imagenes[0] 
        ? (product.imagenes[0].startsWith('http') ? product.imagenes[0] : product.imagenes[0])
        : '../images/default-product.png';
    
    const hasDiscount = product.precioOriginal && parseFloat(product.precioOriginal) > parseFloat(product.precio);
    const discount = hasDiscount ? Math.round(((product.precioOriginal - product.precio) / product.precioOriginal) * 100) : 0;
    const discountHtml = hasDiscount 
        ? `<span class="u-palette-1-base u-product-badge u-product-control u-text u-text-white u-text-2" style="display: block;">-${discount}%</span>` 
        : '';
    
    return `
        <div class="u-align-center u-container-align-center u-container-style u-products-item u-repeater-item" data-animation-name="customAnimationIn" data-animation-duration="1500" data-animation-delay="200">
            <div class="u-container-layout u-similar-container u-container-layout-1">
                <a href="Producto.html?id=${product.id}">
                    <img src="${imageUrl}" alt="${product.titulo}" class="u-expanded-width u-image u-image-contain u-image-default u-product-control u-image-1">
                </a>
                <h4 class="u-product-control u-text u-text-1">
                    <a class="u-product-title-link" href="Producto.html?id=${product.id}">${product.titulo}</a>
                </h4>
                <div data-add-zero-cents="true" class="u-product-control u-product-price u-product-price-1">
                    <div class="u-price-wrapper u-spacing-10">
                        ${hasDiscount ? `<div class="u-old-price" style="text-decoration: line-through !important;">${formatPrice(product.precioOriginal)}</div>` : ''}
                        <div class="u-price u-text-palette-2-base" style="font-size: 1.25rem; font-weight: 700;">${formatPrice(product.precio)}</div>
                    </div>
                </div>
                ${discountHtml}
                <a href="Producto.html?id=${product.id}" class="u-border-none u-btn u-button-style u-hover-palette-3-light-2 u-palette-3-base u-btn-1" style="margin-top: 10px;">Ver Detalles</a>
            </div>
        </div>
    `;
}

// Cargar productos cuando el DOM esté listo
document.addEventListener('DOMContentLoaded', function() {
    fetch('../products/products.json')
        .then(response => response.json())
        .then(data => {
            const promocionesProducts = data.productos.filter(p => p.promocion === true);
            const grid = document.getElementById('promociones-grid');
            const noProducts = document.getElementById('no-products');
            
            if (promocionesProducts.length === 0) {
                noProducts.style.display = 'block';
            } else {
                noProducts.style.display = 'none';
                grid.innerHTML = promocionesProducts.map(createProductCard).join('');
            }
        })
        .catch(error => {
            console.error('Error cargando productos:', error);
            document.getElementById('no-products').style.display = 'block';
        });
});
</script>
