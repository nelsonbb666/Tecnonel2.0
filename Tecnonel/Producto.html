    <script>
      // Función para obtener el parámetro de la URL
      function getUrlParameter(name) {
        name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
        var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
        var results = regex.exec(location.search);
        return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
      }

      // Función para formatear precio
      function formatPrice(price) {
        return '$' + parseFloat(price).toLocaleString('es-CO');
      }

      // Cargar producto cuando la página esté lista
      document.addEventListener('DOMContentLoaded', function() {
        const productId = getUrlParameter('id');
        
        console.log('ID del producto desde URL:', productId);
        console.log('URL completa:', window.location.href);
        
        if (!productId) {
          document.getElementById('product-title').textContent = 'Producto no especificado';
          document.getElementById('product-description').textContent = 'Por favor, seleccione un producto válido.';
          return;
        }

        // Intentar cargar products.json con diferentes rutas posibles
        let jsonPath = '../products/products.json';
        
        // Si estamos en Tecnonel/, ajustar la ruta
        if (window.location.pathname.includes('/Tecnonel/')) {
          jsonPath = '../products/products.json';
        }
        
        console.log('Ruta JSON intentada:', jsonPath);
        
        fetch(jsonPath)
          .then(response => {
            console.log('Estado de la respuesta:', response.status);
            console.log('Headers:', response.headers);
            if (!response.ok) {
              throw new Error('Error HTTP: ' + response.status);
            }
            return response.json();
          })
          .then(data => {
            console.log('Datos cargados exitosamente:', data);
            console.log('Número de productos:', data.productos ? data.productos.length : 0);
            
            if (!data.productos) {
              throw new Error('El JSON no contiene la propiedad "productos"');
            }
            
            const product = data.productos.find(p => {
              console.log('Comparando ID:', p.id, 'con', productId, '=', (p.id === productId));
              return p.id === productId;
            });
            console.log('Producto encontrado:', product);
            
            if (!product) {
              const idsDisponibles = data.productos.map(p => p.id).join(', ');
              document.getElementById('product-title').textContent = 'Producto no encontrado';
              document.getElementById('product-description').textContent = 'El producto "' + productId + '" no existe. IDs disponibles: ' + idsDisponibles;
              return;
            }

            // Actualizar título de la página
            document.title = product.titulo + ' - Tecnonel';
            
            // Cargar datos del producto
            document.getElementById('product-title').textContent = product.titulo;
            document.getElementById('product-price').textContent = formatPrice(product.precio);
            
            // Precio anterior si existe
            const oldPriceElement = document.getElementById('product-old-price');
            if (product.precioOriginal && product.precioOriginal !== product.precio) {
              oldPriceElement.textContent = formatPrice(product.precioOriginal);
              oldPriceElement.style.display = 'block';
              
              // Calcular descuento
              const discount = Math.round(((product.precioOriginal - product.precio) / product.precioOriginal) * 100);
              const badgeElement = document.getElementById('product-badge');
              badgeElement.textContent = '-' + discount + '%';
              badgeElement.style.display = 'block';
            }
            
            // Descripción
            document.getElementById('product-description').textContent = product.descripcion;
            
            // Categoría
            const categoryLink = document.getElementById('product-category-link');
            if (product.categoria) {
              categoryLink.textContent = product.categoria;
              categoryLink.href = 'Categoria.html?id=' + product.categoria;
            }
            
            // Galería de imágenes
            const galleryInner = document.getElementById('gallery-inner');
            const galleryThumbnails = document.getElementById('gallery-thumbnails');
            
            if (product.imagenes && product.imagenes.length > 0) {
              let galleryHTML = '';
              let thumbnailsHTML = '';
              
              product.imagenes.forEach((image, index) => {
                const isActive = index === 0 ? 'u-active' : '';
                const imageUrl = image.startsWith('http') ? image : image;
                
                galleryHTML += `
                  <div class="u-carousel-item u-gallery-item u-carousel-item-1 ${isActive}">
                    <div class="u-back-slide">
                      <img class="u-back-image u-expanded u-image-contain" src="${imageUrl}">
                    </div>
                    <div class="u-over-slide u-over-slide-1">
                      <h3 class="u-gallery-heading">${product.titulo}</h3>
                      <p class="u-gallery-text">${product.descripcion.substring(0, 100)}...</p>
                    </div>
                  </div>
                `;
                
                thumbnailsHTML += `
                  <li class="u-carousel-thumbnail u-carousel-thumbnail-1 ${isActive}" data-u-target="#product-gallery" data-u-slide-to="${index}">
                    <img class="u-carousel-thumbnail-image u-image" src="${imageUrl}">
                  </li>
                `;
              });
              
              galleryInner.innerHTML = galleryHTML;
              galleryThumbnails.innerHTML = thumbnailsHTML;
            } else {
              // Imagen por defecto si no hay imágenes
              galleryInner.innerHTML = `
                <div class="u-carousel-item u-gallery-item u-carousel-item-1 u-active">
                  <div class="u-back-slide">
                    <img class="u-back-image u-expanded u-image-contain" src="../images/default-product.svg">
                  </div>
                </div>
              `;
              galleryThumbnails.innerHTML = `
                <li class="u-carousel-thumbnail u-carousel-thumbnail-1 u-active" data-u-target="#product-gallery" data-u-slide-to="0">
                  <img class="u-carousel-thumbnail-image u-image" src="../images/default-product.svg">
                </li>
              `;
            }
            
            // Video de YouTube
            const videoFrame = document.querySelector('.embed-responsive-item');
            if (product.video) {
              videoFrame.src = product.video + '?mute=0&showinfo=0&controls=0&start=0';
            }
            
            // Banner de envíos
            const bannerImg = document.querySelector('.u-image-2');
            if (bannerImg && product.bannerInfo) {
              bannerImg.src = product.bannerInfo;
            }
            

            // Configurar botón de comprar (WhatsApp)
            const addToCartBtn = document.getElementById('add-to-cart-btn');
            const quantityInput = document.querySelector('.u-quantity-input input.u-input');

            function openWhatsApp() {
              const quantity = parseInt(quantityInput.value) || 1;
              const productName = product.titulo;
              const whatsappNumber = '573127945678';
              const message = `Quiero comprar ${quantity} ${quantity === 1 ? 'unidad de' : 'unidades de'} ${productName}, ¿cuál es el precio?`;
              const encodedMessage = encodeURIComponent(message);
              const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;
              
              // Abrir WhatsApp en una nueva pestaña
              window.open(whatsappUrl, '_blank');
            }

            // Botones de más y menos
            const minusBtn = document.querySelector('.minus.u-quantity-button');
            const plusBtn = document.querySelector('.plus.u-quantity-button');

            if (minusBtn) {
              minusBtn.addEventListener('click', function(e) {
                e.preventDefault();
                let currentQty = parseInt(quantityInput.value) || 1;
                if (currentQty > 1) {
                  quantityInput.value = currentQty - 1;
                }
              });
            }

            if (plusBtn) {
              plusBtn.addEventListener('click', function(e) {
                e.preventDefault();
                let currentQty = parseInt(quantityInput.value) || 1;
                quantityInput.value = currentQty + 1;
              });
            }

            // Evento click en el botón de comprar
            addToCartBtn.addEventListener('click', function(e) {
              e.preventDefault();
              openWhatsApp();
            });
          })
          .catch(error => {
            console.error('Error:', error);
            document.getElementById('product-title').textContent = 'Error al cargar el producto';
            document.getElementById('product-description').textContent = 'Hubo un problema al cargar los datos del producto. Por favor, inténtelo más tarde.';
          });
      });
    </script>
