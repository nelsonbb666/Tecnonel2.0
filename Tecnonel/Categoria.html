<script>
// Mapeo de categorías (ID -> Nombre y datos)
const categoriesMap = {
    'tecnologia': { name: '📱 Tecnología y Celulares', description: 'Cargadores, Power Banks, Soportes, Cables USB, Audífonos y Parlantes Bluetooth.' },
    'hogar-inteligente': { name: '🏠 Hogar Inteligente', description: 'Cámaras WiFi, Timbres Inteligentes, Sensores, Luces LED y Enchufes Inteligentes.' },
    'iluminacion-led': { name: '💡 Iluminación LED', description: 'Tiras RGB, Lámparas Decorativas, Luces con Sensor y Escritorio.' },
    'cocina-inteligente': { name: '🍳 Cocina Inteligente', description: 'Selladoras, Picadoras, Básculas, Dispensadores y Organizadores.' },
    'vehiculos': { name: '🚗 Vehículos', description: 'Soportes, Aspiradoras, Cargadores para Carro y Luces LED.' },
    'gaming': { name: '🎮 Gaming y Entretenimiento', description: 'Controles, Teclados, Mouse, Headsets y Accesorios Gamer.' },
    'oficina': { name: '💼 Oficina y Escritorio', description: 'Organizadores, Lámparas de Escritorio, Accesorios de Computadora.' },
    'herramientas': { name: '🔧 Herramientas y Hogar', description: 'Herramientas, Organización, Seguridad y Mantenimiento.' },
    'regalos': { name: '🎁 Regalos y Novedades', description: 'Productos únicos, innovadores y perfectos para regalar.' },
    'cuidado-personal': { name: '💆 Cuidado Personal', description: 'Máquinas de afeitar, cortadoras y accesorios de cuidado personal.' },
    'virales': { name: '🔥 Productos Virales', description: 'Los productos más populares y trending del momento.' },
    'audio': { name: '🔊 Audio y Música', description: 'Audífonos Bluetooth, Parlantes, Micrófonos y Accesorios.' }
};

// Función para obtener el parámetro de la URL
function getUrlParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
}

// Función para formatear precio
function formatPrice(price) {
    return '$' + parseFloat(price).toFixed(2);
}

// Función para crear tarjeta de producto
function createProductCard(product) {
    // Usar la primera imagen si existe, verificar si es URL completa o ruta relativa
    let imageUrl = '../images/default-product.png';
    let imageCrossOrigin = '';
    if (product.imagenes && product.imagenes.length > 0) {
        const firstImage = product.imagenes[0];
        // Si la imagen ya es una URL completa (empieza con http), usarla directamente
        if (firstImage.startsWith('http://') || firstImage.startsWith('https://')) {
            imageUrl = firstImage;
            // Agregar crossorigin anonymous para imágenes externas
            imageCrossOrigin = 'crossorigin="anonymous"';
        } else {
            // Si es una ruta relativa, agregar el prefijo img/
            imageUrl = firstImage;
        }
    }
    
    const hasDiscount = product.precioOriginal && parseFloat(product.precioOriginal) > parseFloat(product.precio);
    const discountHtml = hasDiscount 
        ? `<span class="product-discount">$${parseFloat(product.precioOriginal).toLocaleString('es-CO')}</span>` 
        : '';
    
    return `
        <div class="u-list-item u-radius u-repeater-item u-shape-round u-white u-list-item-product" data-animation-name="customAnimationIn" data-animation-duration="1500" data-animation-delay="200">
            <div class="u-container-layout u-similar-container u-valign-top-lg u-valign-top-md u-valign-top-sm u-valign-top-xs u-container-layout-product">
                <a href="Producto.html?id=${product.id}" class="u-product-link">
                    <img src="${imageUrl}" alt="${product.titulo}" class="u-expanded-width u-image u-image-round u-radius u-image-product" ${imageCrossOrigin} onerror="this.src='../images/default-product.png'; this.onerror=null;">
                </a>
                <h5 class="u-align-center u-text u-text-product-title">${product.titulo}</h5>
                <p class="u-align-center u-text u-text-product-description">${product.descripcion.substring(0, 100)}...</p>
                <div class="u-align-center u-price-container">
                    ${discountHtml}
                    <span class="product-price">$${parseFloat(product.precio).toLocaleString('es-CO')}</span>
                </div>
                <a href="Producto.html?id=${product.id}" class="u-active-palette-1-base u-align-center u-border-2 u-border-active-palette-1-base u-border-hover-palette-1-base u-border-palette-1-light-1 u-btn u-btn-round u-button-style u-hover-palette-1-base u-radius u-text-active-white u-text-body-color u-text-hover-white u-white u-btn-product">Ver Detalles</a>
            </div>
        </div>
    `;
}

// Función principal para cargar productos
async function loadProducts() {
    const categoryId = getUrlParam('id');
    const productsGrid = document.getElementById('products-grid');
    const categoryTitle = document.getElementById('category-title');
    const noProducts = document.getElementById('no-products');
    const productsContainer = document.getElementById('products-container');
    
    // Validar que haya un ID de categoría
    if (!categoryId) {
        categoryTitle.textContent = 'Categoría no especificada';
        noProducts.style.display = 'block';
        productsContainer.style.display = 'none';
        return;
    }
    
    // Obtener información de la categoría
    const categoryInfo = categoriesMap[categoryId];
    if (categoryInfo) {
        categoryTitle.textContent = categoryInfo.name;
        document.title = `${categoryInfo.name} - Tecnonel`;
    } else {
        categoryTitle.textContent = 'Categoría no encontrada';
        noProducts.style.display = 'block';
        productsContainer.style.display = 'none';
        return;
    }
    
    try {
        // Cargar productos desde JSON
        const response = await fetch('../products/products.json');
        const data = await response.json();
        
        // Filtrar productos por categoría (usando el campo 'categoria')
        const filteredProducts = data.productos.filter(product => 
            product.categoria === categoryId
        );
        
        // Mostrar u ocultar según resultados
        if (filteredProducts.length === 0) {
            noProducts.style.display = 'block';
            productsContainer.style.display = 'none';
        } else {
            noProducts.style.display = 'none';
            productsContainer.style.display = 'block';
            
            // Renderizar productos
            productsGrid.innerHTML = filteredProducts.map(createProductCard).join('');
        }
    } catch (error) {
        console.error('Error cargando productos:', error);
        categoryTitle.textContent = 'Error cargando productos';
        noProducts.style.display = 'block';
        productsContainer.style.display = 'none';
    }
}

// Cargar productos cuando el DOM esté listo
document.addEventListener('DOMContentLoaded', loadProducts);
</script>
