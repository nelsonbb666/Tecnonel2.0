name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Asegúrate de que esto coincida con tu rama principal (main o master)
  workflow_dispatch: # Permite ejecutar manualmente desde la UI de GitHub

# Permisos requeridos para GitHub Pages y OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Cancela ejecuciones anteriores si hay nuevas
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de página
        uses: actions/upload-pages-artifact@v3
        with:
          # Sube todo el contenido del repositorio (para sitios estáticos simples)
          # O cambia '.' por la carpeta donde esté tu build (ej: 'dist', 'build')
          path: '.'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
